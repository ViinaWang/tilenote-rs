[package]
name = "tilenote"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Wayland/Hyprland floating Markdown note tiles in Rust + egui"
license = "MIT"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_commonmark = { version = "=0.22.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
